x-project-name: &project_name mtl-commerce-prod

networks:
  mtl-network:
    driver: bridge

services:
  backend:
    image: quangthai87/mytholaptopv3:backend-latest
    container_name: mtl-backend
    networks:
      - mtl-network
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORE_CORS: ${STORE_CORS:-http://localhost:7004,https://admin.mtl.vn}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:7003,http://localhost:7004,https://admin.mtl.vn}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:7003,http://localhost:7004,https://admin.mtl.vn}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      AUTH_COOKIE_SECURE: "false"
      PORT: 9000
    expose:
      - "9000"
    ports:
      - "7003:9000"
    volumes:
      - ./apps/backend-ui/apps/backend:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  admin-ui:
    image: quangthai87/mytholaptopv3:admin-ui-latest
    container_name: mtl-admin
    networks:
      - mtl-network
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://backend:9000}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "3000"
    ports:
      - "7004:3000"
    volumes:
      - ./apps/admin-ui:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtl-redis
    networks:
      - mtl-network
    volumes:
      - mtl-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mtl-redis-data:
