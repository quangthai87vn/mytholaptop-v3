x-project-name: &project_name mtl-commerce-prod

services:
  backend:
    build:
      context: ./apps/backend-ui
      dockerfile: apps/backend/Dockerfile
    container_name: mtl-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000,http://localhost:3000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:5173,http://localhost:3000,https://admin.mtl.vn}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:5173,http://localhost:3000,http://localhost:9000,http://127.0.0.1:3000,https://admin.mtl.vn}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PORT: ${BACKEND_PORT:-9000}
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    volumes:
      - ./apps/backend-ui/apps/backend:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  admin-ui:
    build:
      context: ./apps/admin-ui
      dockerfile: Dockerfile
    container_name: mtl-admin
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-https://backend.mtl.vn}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    volumes:
      - ./apps/admin-ui:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mtl-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mtl-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: mtl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword&1P@ssw0rd&Aimabiettaolaai
      POSTGRES_DB: mytholaptop
    ports:
      - "7000:5432"
    volumes:
      - mtl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mtl-redis-data:
  mtl-postgres-data:
